name: server-gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-short-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.7
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Go and coverage gate parser
        run: |
          go mod verify
          go vet ./...
          go build ./...
          scripts/test-check-go-coverage.sh
          bash -n scripts/install.sh
          cmp scripts/install.sh internal/controller/install.sh
          bash scripts/test-install.sh
      - name: Build checksummed Linux Agent artifacts
        run: |
          sh scripts/build-agent-dist.sh /tmp/stcontrol-agent-dist
          (cd /tmp/stcontrol-agent-dist && sha256sum --check agent-linux-amd64.sha256 agent-linux-arm64.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: stcontrol-agent-${{ github.sha }}
          path: /tmp/stcontrol-agent-dist/
          if-no-files-found: error
          retention-days: 14
      - name: Run short race suite
        run: go test -short -race -p=1 -count=1 ./...
      - name: Test and build Web
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npm audit --omit=dev

  full-postgresql-coverage:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/server' || github.base_ref == 'server'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stcontrol_test
          POSTGRES_PASSWORD: stcontrol_ci_only
          POSTGRES_DB: stcontrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stcontrol_test -d stcontrol_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      STCONTROL_TEST_POSTGRES_DSN: postgres://stcontrol_test:stcontrol_ci_only@127.0.0.1:5432/stcontrol_test?sslmode=disable
      STCONTROL_TEST_TAVERN_ROOT: /tmp/stcontrol-ci-Sillytarven-online
      STCONTROL_TEST_TAVERN_SHA: f4c84f33b2364b8a7d1b5e10a1046ab6d147bc0d
      STCONTROL_TEST_PG_BIN: /tmp/stcontrol-ci-pg17/pg_dump
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.7
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Prepare pinned cross-repository fixture
        run: |
          git init "$STCONTROL_TEST_TAVERN_ROOT"
          git -C "$STCONTROL_TEST_TAVERN_ROOT" remote add origin https://github.com/inliver233/Sillytarven-online.git
          git -C "$STCONTROL_TEST_TAVERN_ROOT" fetch --depth=1 origin "$STCONTROL_TEST_TAVERN_SHA"
          git -C "$STCONTROL_TEST_TAVERN_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$STCONTROL_TEST_TAVERN_ROOT" rev-parse HEAD)" = "$STCONTROL_TEST_TAVERN_SHA"
          npm ci --ignore-scripts --prefix "$STCONTROL_TEST_TAVERN_ROOT"
          npm run postinstall --prefix "$STCONTROL_TEST_TAVERN_ROOT"
          npm run test:server-update --prefix "$STCONTROL_TEST_TAVERN_ROOT"
      - name: Provide PostgreSQL 17 pg_dump
        run: |
          mkdir -p "$(dirname "$STCONTROL_TEST_PG_BIN")"
          printf '%s\n' '#!/bin/sh' 'exec docker run --rm --network host -e PGPASSWORD postgres:17-alpine pg_dump "$@"' >"$STCONTROL_TEST_PG_BIN"
          chmod 700 "$STCONTROL_TEST_PG_BIN"
          "$STCONTROL_TEST_PG_BIN" --version
      - name: Run full PostgreSQL and process acceptance suite
        run: go test -p=1 -count=1 -v -coverpkg=./... -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce exact deduplicated 80 percent coverage
        run: scripts/check-go-coverage.sh coverage.out 80
      - name: Run full PostgreSQL race suite
        run: go test -p=1 -race -count=1 ./...
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  deployable-controller-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build controller image with Agent distribution
        run: docker build --file Dockerfile.controller --tag stcontrol-controller:server-ci .
      - name: Verify Agent artifacts inside the image
        run: |
          container_id="$(docker create stcontrol-controller:server-ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/controller-agent-dist
          docker cp "$container_id:/app/dist/." /tmp/controller-agent-dist/
          cd /tmp/controller-agent-dist
          sha256sum --check agent-linux-amd64.sha256 agent-linux-arm64.sha256
          test -s agent-linux-amd64
          test -s agent-linux-arm64
