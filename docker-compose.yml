# 总控 TLS 部署(含 PostgreSQL)
# 使用前复制 controller.docker.yaml.example 为 controller.docker.yaml，
# 并在 certs/ 放置 tls.crt/tls.key。
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stcontrol
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the environment}
      POSTGRES_DB: stcontrol
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stcontrol"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    environment:
      CONTROLLER_SECRET_KEY: ${CONTROLLER_SECRET_KEY:?请设置 CONTROLLER_SECRET_KEY(32字节base64)}
      CONTROLLER_BOOTSTRAP_ADMIN_PASSWORD: ${CONTROLLER_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./controller.docker.yaml:/app/controller.yaml:ro
      - ./certs:/run/stcontrol-tls:ro
    ports:
      - "8443:8443"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
