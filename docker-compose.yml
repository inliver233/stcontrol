version: "3.8"

# 总控一键部署(含 PostgreSQL)
# 使用: docker compose up -d
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: stcontrol
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stcontrol}
      POSTGRES_DB: stcontrol
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stcontrol"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    environment:
      CONTROLLER_SECRET_KEY: ${CONTROLLER_SECRET_KEY:?请设置 CONTROLLER_SECRET_KEY(32字节base64)}
      CONTROLLER_BOOTSTRAP_ADMIN_PASSWORD: ${CONTROLLER_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./controller.yaml:/app/controller.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
